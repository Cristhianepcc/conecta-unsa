{% comment %}Enlace del sidebar. Contexto: url, icono, label, key, seccion (activo si key == seccion).{% endcomment %}
<a href="{{ url }}"
   {% if key == seccion %}aria-current="page"{% endif %}
   class="flex items-center gap-3 px-3 py-2 rounded-lg
          {% if key == seccion %}bg-granate-50 text-granate-700 font-semibold{% else %}text-slate-600 hover:bg-slate-100 hover:text-granate-700{% endif %}">
  <i data-lucide="{{ icono }}" class="w-4 h-4 shrink-0"></i> {{ label }}
</a>
