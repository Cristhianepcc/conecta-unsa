{% comment %}Barra de transparencia. Contexto: et (alta|media|baja), pct (entero). {% endcomment %}
<div class="flex items-center gap-2 min-w-[7rem]"
     role="img" aria-label="Transparencia {{ et }}, {{ pct }} por ciento">
  <div class="h-1.5 flex-1 rounded-full bg-slate-100 overflow-hidden">
    <div class="h-full rounded-full {% if et == 'alta' %}bg-exito{% elif et == 'media' %}bg-alerta{% else %}bg-peligro{% endif %}"
         style="width: {{ pct }}%"></div>
  </div>
  <span class="text-xs font-semibold tabular-nums {% if et == 'alta' %}text-exito{% elif et == 'media' %}text-alerta{% else %}text-peligro{% endif %}">{{ pct }}%</span>
</div>
