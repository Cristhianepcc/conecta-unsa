{% comment %}Semáforo de transparencia. Contexto: et (alta|media|baja), pct (entero). {% endcomment %}
<span class="inline-flex items-center gap-1.5 text-sm"
      title="Transparencia {{ pct }}%"
      aria-label="Transparencia {{ et }}, {{ pct }} por ciento">
  <span class="h-2.5 w-2.5 rounded-full
    {% if et == 'alta' %}bg-exito{% elif et == 'media' %}bg-alerta{% else %}bg-peligro{% endif %}"></span>
  <span class="font-medium text-slate-700">{{ pct }}%</span>
</span>
